[workspace]
authors = ["Anne Hartebrodt <anne.hartebrodt[a]fau.de>"]
channels = ["conda-forge", "bioconda", "main", "r", "msys2"]
name = "netmap-evaluation"
platforms = ["linux-64"]
version = "0.1.0"



[dependencies]
python = "*"
numpy = "<2.0"
anndata = "<0.11"

[pypi-dependencies]
signifikante = { git = "https://github.com/bionetslab/SignifiKANTE.git" }

[tasks]
install-kernel = "python -m ipykernel install --user --name pixi_netmap --display-name pixi_netmap"
uninstall-kernel = "jupyter kernelspec uninstall pixi_netmap"
run-grnboost2-benchmark = "bash src/manuscript_synthetic/manuscript_results/grnboost2/sweep_grnboost2.sh"

