[workspace]
authors = ["Anne Hartebrodt <anne.hartebrodt[a]fau.de>"]
channels = ["conda-forge", "bioconda", "main", "r", "msys2", "rapidsai", "nvidia"]
name = "netmap-evaluation"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.8"

[tasks]
pypiper_install = "python -m pip install pypiper"

[dependencies]
pytorch-gpu = "*"
cuda-version = "12.8.*"
r-base = ">=4.4.3,<4.5"
scikit-learn = ">=1.6.1,<2"
pandas = ">=2.2.3,<3"
scipy = ">=1.15.2,<2"
numpy = "*"
scanpy = ">=1.10.4,<2"
anndata = ">=0.11.4,<0.12"
bioconductor-ucell = ">=2.10.1,<3"
seaborn = ">=0.13.2,<0.14"
statsmodels = ">=0.14.4,<0.15"
omnipath = ">=1.0.8,<2"
bioconductor-edger = ">=4.4.0,<5"
bioconductor-deseq2 = ">=1.46.0,<2"
bioconductor-genomeinfodb = ">=1.42.0,<2"
bioconductor-genomeinfodbdata = ">=1.2.13,<2"
bioconductor-biocinstaller = ">=1.22.3,<2"
captum = ">=0.7.0,<0.8"
python-igraph = ">=0.11.8,<0.12"
leidenalg = ">=0.10.2,<0.11"
pingouin = ">=0.5.5,<0.6"
dask="*"
dask-core="*"
dask-expr="*"
distributed="*"
scikit-learn-extra = ">=0.2.0,<0.3"
decoupler = ">=1.5.0,<2"
xgboost = ">=3.1.2,<4"
gtfparse = ">=2.5.0,<3"

[pypi-dependencies]
piper = ">=0.14.4, <0.15"
rpy2 = ">=3.5.17, <4"
napy = ">=0.2.2, <0.3"
signifikante = { git = "https://github.com/bionetslab/signifikante.git" }

[feature.renv.dependencies]
r-base = "*"

[environments]
renv = ["renv"]
