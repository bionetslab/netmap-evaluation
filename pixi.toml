[workspace]
authors = ["Anne Hartebrodt <anne.hartebrodt[a]fau.de>"]
channels = ["conda-forge", "bioconda", "main", "r", "msys2", "rapidsai", "nvidia"]
name = "netmap-evaluation"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.8"

[tasks]
pypiper_install = "python -m pip install pypiper"

[dependencies]
pytorch-gpu = "*"
cuda-version = "12.8.*"
cupy = ">=13.5.1,<14"
sphinx-autobuild = ">=2025.8.25,<2026"

[pypi-dependencies]
piper = ">=0.14.4, <0.15"
netmap = { git = "https://github.com/bionetslab/netmap" }

