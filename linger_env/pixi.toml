[workspace]
authors = ["Anne Hartebrodt <anne.hartebrodt[a]fau.de>"]
channels = ["conda-forge", "bioconda"]
name = "netmap-evaluation-linger"
platforms = ["linux-64"]
version = "0.1.0"

# Standalone environment for running LINGER (https://github.com/Durenlab/LINGER),
# used by src/evaluation/prepare_linger_10x_multiome.py and src/evaluation/run_linger.py.
# Kept separate from the top-level ../pixi.toml because LingerGRN pins exact
# versions of scipy/pandas/scikit-learn/scanpy/anndata (see install_requires
# of LingerGRN==1.110 on PyPI) that would conflict with the main env's stack.
#
# Mirrors LINGER's own install instructions (docs/PBMC.md):
#   conda create -n LINGER python==3.10.0
#   conda activate LINGER
#   pip install LingerGRN==1.110
#   conda install bioconda::bedtools

[system-requirements]
cuda = "12.8"

[tasks]
install-kernel = "python -m ipykernel install --user --name pixi_netmap_linger --display-name pixi_netmap_linger"
uninstall-kernel = "jupyter kernelspec uninstall pixi_netmap_linger"
test-import = "python -c 'import LingerGRN; from LingerGRN import preprocess, pseudo_bulk, LL_net, LINGER_tr, TF_activity; import shutil; assert shutil.which(\"bedtools\"), \"bedtools not on PATH\"; print(\"LingerGRN OK:\", LingerGRN.__file__)'"

[dependencies]
python = "3.10.*"
pytorch-gpu = "*"
cuda-version = "12.8.*"
scipy = "1.11.3.*"
numpy = "*"
pandas = "2.0.3.*"
shap = "0.42.0.*"
scikit-learn = "1.3.0.*"
joblib = "1.3.2.*"
matplotlib = "3.8.0.*"
seaborn = "0.13.0.*"
statsmodels = "0.14.1.*"
umap-learn = "*"
scanpy = "1.9.5.*"
anndata = "0.9.2.*"
pybedtools = "0.12.0.*"
bedtools = "*"
jupyter = "*"
ipykernel = "*"

[pypi-dependencies]
LingerGRN = "==1.110"
